name: wakefit
description: Offline alarm that can only be dismissed by a camera-verified push-up challenge.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  alarm: ^5.8.0
  google_mlkit_pose_detection: ^0.14.1
  google_mlkit_commons: ^0.11.0
  camera: ^0.11.0+2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  audioplayers: ^6.0.0
  permission_handler: ^12.0.1
  provider: ^6.1.2
  file_picker: ^10.3.10
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/alarm.mp3